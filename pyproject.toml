[project]
name = "pyFNCH"
version = "0.0.1"
authors = [
  { name="Ethan O'Farrell", email="etofarre@umich.edu" },
]
description = "Fisher Non-Central Hypergeometric distributions Probability functions and efficient parameter estimation"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/thekwanlab/pyFNCH"
Issues = "https://github.com/thekwanlab/pyFNCH/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"